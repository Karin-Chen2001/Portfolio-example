<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作品集首頁 | 陳語彤 Karin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans TC', sans-serif;
        }

        :root {
            --bg-overlay: rgba(255, 255, 255, 0.88);
            --card-bg: #ffffff;
            --text-main: #1a1a1a;
            --text-sub: #555555;
            --primary-pop: #E05A47; /* 鮮豔暖珊瑚橘，強烈吸引視覺 */
            --accent-yellow: #D97706; /* 鮮豔芥末黃 */
            --border-light: #e5e7eb;
            --shadow-square: 0 10px 25px rgba(0, 0, 0, 0.05);
        }

        body {
            background-color: #fafafa;
            color: var(--text-main);
            line-height: 1.6;
            min-height: 100vh;
            position: relative;
        }

        /* 淺色文青背景底圖 */
        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background-image: linear-gradient(var(--bg-overlay), var(--bg-overlay)), 
                              url('https://images.unsplash.com/photo-1499750310107-5fef28a66643?q=80&w=2000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            z-index: -1;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 4rem 1.5rem;
        }

        header {
            text-align: center;
            margin-bottom: 3.5rem;
        }

        header h1 {
            font-size: 2.5rem;
            color: var(--primary-pop);
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
        }

        header p {
            color: var(--text-sub);
            font-size: 1.1rem;
        }

        /* 正方形感 Grid 網格配置 */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
        }

        /* 正方形視覺卡片 */
        .square-card {
            background-color: var(--card-bg);
            border: 2px solid var(--border-light);
            border-radius: 8px; /* 微圓角，保持正方感 */
            padding: 2.2rem;
            aspect-ratio: 1 / 1; /* 強制接近正方形 proportions */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: var(--shadow-square);
            transition: all 0.3s ease;
        }

        .square-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary-pop);
            box-shadow: 0 15px 35px rgba(224, 90, 71, 0.15);
        }

        .card-tag {
            display: inline-block;
            background-color: #FEF3C7;
            color: var(--accent-yellow);
            font-weight: 700;
            font-size: 0.85rem;
            padding: 0.3rem 0.8rem;
            border-radius: 4px;
            width: fit-content;
            margin-bottom: 1rem;
        }

        .card-title {
            font-size: 1.6rem;
            color: var(--text-main);
            font-weight: 700;
            margin-bottom: 0.8rem;
        }

        .card-desc {
            color: var(--text-sub);
            font-size: 1rem;
            flex-grow: 1;
        }

        .card-actions {
            display: flex;
            gap: 0.8rem;
            margin-top: 1.5rem;
        }

        .btn-main {
            flex: 1;
            text-align: center;
            padding: 0.8rem 1rem;
            background-color: var(--primary-pop);
            color: #ffffff;
            font-weight: 700;
            text-decoration: none;
            border-radius: 6px;
            transition: background 0.2s ease;
        }

        .btn-main:hover {
            background-color: #C84332;
        }

        .btn-sub {
            flex: 1;
            text-align: center;
            padding: 0.8rem 1rem;
            background-color: #ffffff;
            color: var(--primary-pop);
            border: 2px solid var(--primary-pop);
            font-weight: 700;
            text-decoration: none;
            border-radius: 6px;
            transition: all 0.2s ease;
        }

        .btn-sub:hover {
            background-color: #FEE2E2;
        }

        footer {
            margin-top: 5rem;
            text-align: center;
            color: var(--text-sub);
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

    <div class="bg-overlay"></div>

    <div class="container">
        <header>
            <h1>陳語彤 Karin 的作品集總覽</h1>
            <p>展示現代網頁開發、數位科技學習歷程與互動實作成果</p>
        </header>

        <main class="card-grid">
            <!-- 卡片 1：數位科技概論 -->
            <div class="square-card">
                <div>
                    <span class="card-tag">核心專案</span>
                    <h2 class="card-title">數位科技概論作業</h2>
                    <p class="card-desc">整合 HTML5 語意化結構、網頁設計理念與個人作品集實務呈現。</p>
                </div>
                <div class="card-actions">
                    <a href="digital-technology.html" class="btn-main">進入專案主頁</a>
                    <a href="act01.html" target="_blank" class="btn-sub">活動 01 獨立頁</a>
                </div>
            </div>

            <!-- 卡片 2：活動 01 直接連結 -->
            <div class="square-card">
                <div>
                    <span class="card-tag">HTML 語意化</span>
                    <h2 class="card-title">活動 01：文字與層級</h2>
                    <p class="card-desc">展示純 HTML 語意標籤，包含主題層級、劃重點與科學符號展示。</p>
                </div>
                <div class="card-actions">
                    <a href="act01.html" target="_blank" class="btn-main">開啟純 HTML 頁面</a>
                </div>
            </div>
        </main>

        <footer>
            <p>© 2026 陳語彤 Karin. All rights reserved.</p>
        </footer>
    </div>

</body>
</html>
