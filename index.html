<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>陳語彤 Karin 學習媒材與設計學系 | 個人作品集</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans TC', sans-serif;
        }

        :root {
            --bg-overlay: rgba(255, 255, 255, 0.92);
            --card-bg: #ffffff;
            --text-main: #111111;
            --text-sub: #555555;
            --primary-green: #1C4D3B; /* 質感深綠色 */
            --accent-green: #2E7D62;  /* 柔和中綠色 */
            --light-green-bg: #E8F5E9; /* 淺綠標籤背景 */
            --border-light: #e5e7eb;
            --shadow-square: 0 8px 20px rgba(0, 0, 0, 0.05);
        }

        body {
            background-color: #fafafa;
            color: var(--text-main);
            line-height: 1.5;
            min-height: 100vh;
            position: relative;
        }

        /* 淺色文青背景底圖 */
        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background-image: linear-gradient(var(--bg-overlay), var(--bg-overlay)), 
                              url('https://images.unsplash.com/photo-1499750310107-5fef28a66643?q=80&w=2000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            z-index: -1;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 3.5rem 1.5rem;
        }

        /* 最上方正中央的大標題區塊 */
        .main-header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .main-header h1 {
            font-size: 2.3rem;
            font-weight: 900;
            color: #111111; /* 黑色字體 */
            letter-spacing: -0.5px;
            line-height: 1.3;
            margin-bottom: 0.6rem;
        }

        .main-header p {
            color: var(--text-sub);
            font-size: 1.05rem;
        }

        .section-title {
            font-size: 1.4rem;
            color: var(--primary-green);
            font-weight: 700;
            margin-bottom: 1.5rem;
            border-left: 4px solid var(--primary-green);
            padding-left: 0.8rem;
        }

        /* 網格配置 (適度縮小邊距與間距，防止多餘留白) */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        /* 精簡內部空白的卡片 */
        .square-card {
            background-color: var(--card-bg);
            border: 1.5px solid var(--border-light);
            border-radius: 10px;
            padding: 1.4rem 1.6rem; /* 縮減內邊距，減少框框內空白 */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: var(--shadow-square);
            transition: all 0.25s ease;
        }

        .square-card:hover {
            transform: translateY(-3px);
            border-color: var(--primary-green);
            box-shadow: 0 10px 25px rgba(28, 77, 59, 0.12);
        }

        .card-tag {
            display: inline-block;
            background-color: var(--light-green-bg);
            color: var(--primary-green);
            font-weight: 700;
            font-size: 0.8rem;
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
            width: fit-content;
            margin-bottom: 0.6rem;
        }

        .card-title {
            font-size: 1.3rem;
            color: var(--text-main);
            font-weight: 700;
            margin-bottom: 0.6rem;
        }

        /* 數位科技概論三句介紹 */
        .card-desc {
            color: var(--text-sub);
            font-size: 0.9rem;
            line-height: 1.5;
            margin-bottom: 1rem;
        }

        .card-desc span {
            display: block;
            margin-bottom: 0.25rem;
        }

        .card-actions {
            margin-top: 0.5rem;
        }

        .btn-main {
            display: block;
            width: 100%;
            text-align: center;
            padding: 0.65rem 1rem;
            background-color: var(--primary-green);
            color: #ffffff;
            font-size: 0.9rem;
            font-weight: 700;
            text-decoration: none;
            border-radius: 6px;
            transition: background 0.2s ease;
        }

        .btn-main:hover {
            background-color: var(--accent-green);
        }

        footer {
            margin-top: 3rem;
            text-align: center;
            color: var(--text-sub);
            font-size: 0.85rem;
        }

        /* 行動裝置適應 */
        @media (max-width: 600px) {
            .main-header h1 {
                font-size: 1.7rem;
            }
        }
    </style>
</head>
<body>

    <div class="bg-overlay"></div>

    <div class="container">
        
        <!-- 最上面正中央的大標題 -->
        <header class="main-header">
            <h1>陳語彤 Karin 學習媒材與設計學系</h1>
            <p>歡迎來到我的個人作品集與課程學習成果展覽頁面。</p>
        </header>

        <!-- 主內容區 -->
        <main>
            <h2 class="section-title">專案列表</h2>

            <div class="card-grid">
                <!-- 數位科技概論卡片 -->
                <div class="square-card">
                    <div>
                        <span class="card-tag">課程作業</span>
                        <h3 class="card-title">數位科技概論</h3>
                        <div class="card-desc">
                            <span>• 本課程專注於培養現代網頁設計與前端開發的核心能力。</span>
                            <span>• 學習運用 HTML 語意化結構與 CSS 視覺風格呈現多樣化版型。</span>
                            <span>• 結合響應式介面設計與無障礙網頁規範，實作豐富的互動專案。</span>
                        </div>
                    </div>
                    <div class="card-actions">
                        <a href="digital-technology.html" class="btn-main">進入課程作業集</a>
                    </div>
                </div>
            </div>
        </main>

        <footer>
            <p>© 2026 陳語彤 Karin. All rights reserved.</p>
        </footer>
    </div>

</body>
</html>
