<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作品集首頁 | 陳語彤 Karin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans TC', sans-serif;
        }

        :root {
            --bg-overlay: rgba(255, 255, 255, 0.90);
            --card-bg: #ffffff;
            --text-main: #111111;
            --text-sub: #555555;
            --primary-pop: #E05A47; /* 鮮豔暖珊瑚橘 */
            --accent-yellow: #D97706; /* 鮮豔芥末黃 */
            --border-light: #e5e7eb;
            --shadow-square: 0 10px 25px rgba(0, 0, 0, 0.05);
        }

        body {
            background-color: #fafafa;
            color: var(--text-main);
            line-height: 1.6;
            min-height: 100vh;
            position: relative;
        }

        /* 淺色文青背景底圖 */
        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background-image: linear-gradient(var(--bg-overlay), var(--bg-overlay)), 
                              url('https://images.unsplash.com/photo-1499750310107-5fef28a66643?q=80&w=2000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            z-index: -1;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 3.5rem 1.5rem;
        }

        /* 個人簡介與頭貼區塊 */
        .profile-card {
            background-color: var(--card-bg);
            border: 2px solid var(--border-light);
            border-radius: 12px;
            padding: 2.5rem;
            box-shadow: var(--shadow-square);
            margin-bottom: 3rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        @media (min-width: 768px) {
            .profile-card {
                flex-direction: row;
                text-align: left;
                align-items: center;
                gap: 2.5rem;
            }
        }

        .avatar-upload-box {
            position: relative;
            width: 150px;
            height: 150px;
            border-radius: 16px;
            overflow: hidden;
            border: 3px solid var(--primary-pop);
            cursor: pointer;
            box-shadow: 0 8px 16px rgba(224, 90, 71, 0.2);
            transition: all 0.3s ease;
            background-color: #f9fafb;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            margin-bottom: 1.5rem;
        }

        @media (min-width: 768px) {
            .avatar-upload-box {
                margin-bottom: 0;
            }
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .avatar-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-sub);
            font-size: 0.85rem;
            text-align: center;
            padding: 0.5rem;
        }

        .avatar-placeholder span {
            font-size: 1.6rem;
            margin-bottom: 0.2rem;
        }

        .avatar-upload-box input[type="file"] {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .profile-info {
            flex-grow: 1;
        }

        .profile-info h1 {
            font-size: 2.2rem;
            color: var(--primary-pop);
            font-weight: 700;
            margin-bottom: 0.3rem;
        }

        .profile-info .subtitle {
            font-size: 1.1rem;
            color: var(--accent-yellow);
            font-weight: 700;
            margin-bottom: 1rem;
        }

        .contact-links {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            justify-content: center;
        }

        @media (min-width: 768px) {
            .contact-links {
                justify-content: flex-start;
            }
        }

        .contact-item {
            display: inline-flex;
            align-items: center;
            background-color: #f9fafb;
            border: 1px solid var(--border-light);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-size: 0.95rem;
            color: var(--text-main);
            text-decoration: none;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .contact-item:hover {
            border-color: var(--primary-pop);
            color: var(--primary-pop);
            background-color: #ffffff;
        }

        .contact-item span {
            font-weight: 700;
            color: var(--primary-pop);
            margin-right: 0.4rem;
        }

        .section-title {
            font-size: 1.5rem;
            color: var(--text-main);
            font-weight: 700;
            margin-bottom: 1.5rem;
            border-left: 4px solid var(--primary-pop);
            padding-left: 0.8rem;
        }

        /* 正方形感 Grid 網格配置 */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
        }

        /* 正方形視覺卡片 */
        .square-card {
            background-color: var(--card-bg);
            border: 2px solid var(--border-light);
            border-radius: 8px;
            padding: 2.2rem;
            aspect-ratio: 1 / 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: var(--shadow-square);
            transition: all 0.3s ease;
        }

        .square-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary-pop);
            box-shadow: 0 15px 35px rgba(224, 90, 71, 0.15);
        }

        .card-tag {
            display: inline-block;
            background-color: #FEF3C7;
            color: var(--accent-yellow);
            font-weight: 700;
            font-size: 0.85rem;
            padding: 0.3rem 0.8rem;
            border-radius: 4px;
            width: fit-content;
            margin-bottom: 1rem;
        }

        .card-title {
            font-size: 1.5rem;
            color: var(--text-main);
            font-weight: 700;
            margin-bottom: 0.8rem;
        }

        .card-desc {
            color: var(--text-sub);
            font-size: 0.98rem;
            flex-grow: 1;
        }

        .card-actions {
            display: flex;
            gap: 0.8rem;
            margin-top: 1.5rem;
        }

        .btn-main {
            flex: 1;
            text-align: center;
            padding: 0.8rem 1rem;
            background-color: var(--primary-pop);
            color: #ffffff;
            font-weight: 700;
            text-decoration: none;
            border-radius: 6px;
            transition: background 0.2s ease;
        }

        .btn-main:hover {
            background-color: #C84332;
        }

        .btn-sub {
            flex: 1;
            text-align: center;
            padding: 0.8rem 1rem;
            background-color: #ffffff;
            color: var(--primary-pop);
            border: 2px solid var(--primary-pop);
            font-weight: 700;
            text-decoration: none;
            border-radius: 6px;
            transition: all 0.2s ease;
        }

        .btn-sub:hover {
            background-color: #FEE2E2;
        }

        footer {
            margin-top: 4rem;
            text-align: center;
            color: var(--text-sub);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="bg-overlay"></div>

    <div class="container">
        
        <!-- 個人頭貼與介紹區塊 -->
        <header class="profile-card">
            <div class="avatar-upload-box" title="點擊上傳大頭照">
                <div class="avatar-placeholder" id="avatarPlaceholder">
                    <span>📷</span>
                    點擊上傳頭像
                </div>
                <img id="avatarImage" class="avatar-img" alt="Karin Avatar">
                <input type="file" id="avatarInput" accept="image/*">
            </div>

            <div class="profile-info">
                <h1>陳語彤 Karin</h1>
                <div class="subtitle">作品集總覽</div>

                <!-- 個人聯繫資料 -->
                <div class="contact-links">
                    <a href="mailto:hebe60716@gmail.com" class="contact-item"><span>✉️</span> Email: hebe60716@gmail.com</a>
                    <a href="tel:0979060906" class="contact-item"><span>📞</span> Phone: 0979-060-906</a>
                    <a href="https://instagram.com/yt.chen_9.6" target="_blank" class="contact-item"><span>📸</span> IG: yt.chen_9.6</a>
                </div>
            </div>
        </header>

        <h2 class="section-title">專案列表</h2>

        <main class="card-grid">
            <!-- 數位科技概論卡片 -->
            <div class="square-card">
                <div>
                    <span class="card-tag">核心專案</span>
                    <h3 class="card-title">數位科技概論作業</h3>
                    <p class="card-desc">包含網頁開發與專案實務展示，以及課程相關活動成果。</p>
                </div>
                <div class="card-actions">
                    <a href="digital-technology.html" class="btn-main">進入專案頁面</a>
                    <a href="act01.html" target="_blank" class="btn-sub">開啟活動01</a>
                </div>
            </div>

            <!-- 活動 01 卡片 -->
            <div class="square-card">
                <div>
                    <span class="card-tag">HTML 練習</span>
                    <h3 class="card-title">活動 01：文字與層級標籤</h3>
                    <p class="card-desc">展示 HTML 語意化文字標籤、主題層級與科學符號。</p>
                </div>
                <div class="card-actions">
                    <a href="act01.html" target="_blank" class="btn-main">開啟純 HTML 頁面</a>
                </div>
            </div>
        </main>

        <footer>
            <p>© 2026 陳語彤 Karin. All rights reserved.</p>
        </footer>
    </div>

    <script>
        const avatarInput = document.getElementById('avatarInput');
        const avatarImage = document.getElementById('avatarImage');
        const avatarPlaceholder = document.getElementById('avatarPlaceholder');

        avatarInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    avatarImage.src = event.target.result;
                    avatarImage.style.display = 'block';
                    avatarPlaceholder.style.display = 'none';
                }
                reader.readAsDataURL(file);
            }
        });
    </script>
</body>
</html>
