<!DOCTYPE html>
<html lang="zh-TW">
<head>

    <title>活動 01：文字層級與科學探索</title>
    <style>
        :root {
            --primary-color: #315f57;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #b9cfc5;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            line-height: 1.8;
            color: var(--text-color);
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 25px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        h1 { border-bottom: 2px solid var(--border-color); padding-bottom: 8px; }

<body>
    <div class="container">
        <h1>活動 01：文字層級與科學探索</h1>
        <p>這段練習展示了 HTML 的語意化文字標籤，包含主題層級、劃重點與科學符號展示。</p>

        <h2>水與生活：小小科學探索日</h2>
        <p>一起從生活中的水，發現科學的有趣之處。</p>

        <h2>活動介紹</h2>
        <p>這次活動適合國小中年級學生，請帶著好奇心一起參加。</p>

        <h3>觀察水的樣子</h3>
        <p>看看不同容器中的水，試著說出你觀察到的變化。</p>

        <h3>認識水的名字</h3>
        <p>水的化學式是 H<sub>2</sub>O。</p>

        <h2>參加前的小提醒</h2>
        <p>請<b>自備水壺</b>，並準備一本觀察筆記。</p>
        <p>今天的探索口號是：<i>先觀察，再提問！</i></p>
        <p>我們將使用面積為 100cm<sup>2</sup> 的方形觀察卡。</p>
    </div>
